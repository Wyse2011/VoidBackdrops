name: Release

# Every push to main publishes the next release automatically:
# it works out the next version from the latest tag, creates that tag and a GitHub Release,
# attaches latest.zip, and updates repo.json so /xlplugins gets the update.
on:
  push:
    branches: [ main ]

# Never run two releases at once, so version bumps stay sequential.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0          # need the full tag history to work out the next version

      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Work out the next version
        id: ver
        shell: pwsh
        run: |
          $versions = @()
          foreach ($t in (git tag --list 'v*')) {
            $p = $t.TrimStart('v','V').Split('.')
            if ($p.Count -ge 2 -and -not ($p | Where-Object { $_ -notmatch '^\d+$' })) {
              while ($p.Count -lt 3) { $p += '0' }
              $versions += [version]("{0}.{1}.{2}" -f $p[0], $p[1], $p[2])
            }
          }
          if ($versions.Count -eq 0) { $next = [version]'1.0.1' }
          else { $l = ($versions | Sort-Object)[-1]; $next = [version]("{0}.{1}.{2}" -f $l.Major, $l.Minor, ($l.Build + 1)) }
          "tag=v$($next.ToString())"      >> $env:GITHUB_OUTPUT
          "version=$($next.ToString()).0" >> $env:GITHUB_OUTPUT
          Write-Host "Next release: v$($next.ToString())"

      - name: Build
        run: dotnet build VoidBackdrops/VoidBackdrops.csproj --configuration Release -p:Version=${{ steps.ver.outputs.version }}

      - name: Find package
        id: pkg
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Recurse -Path VoidBackdrops/bin -Filter latest.zip | Select-Object -First 1
          if (-not $zip) { throw "latest.zip was not produced" }
          $manifest = Get-ChildItem -Path $zip.DirectoryName -Filter VoidBackdrops.json | Select-Object -First 1
          if (-not $manifest) { throw "VoidBackdrops.json was not produced" }
          "zip=$($zip.FullName)"           >> $env:GITHUB_OUTPUT
          "manifest=$($manifest.FullName)" >> $env:GITHUB_OUTPUT

      - name: Create the release and attach latest.zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ steps.ver.outputs.tag }}"
          "${{ steps.pkg.outputs.zip }}"
          --target "${{ github.sha }}"
          --title "${{ steps.ver.outputs.tag }}"
          --notes "Automated release ${{ steps.ver.outputs.tag }}"

      - name: Update repo.json
        shell: pwsh
        run: |
          $repo = "${{ github.repository }}"
          $tag  = "${{ steps.ver.outputs.tag }}"
          $url  = "https://github.com/$repo/releases/download/$tag/latest.zip"
          $m    = Get-Content "${{ steps.pkg.outputs.manifest }}" -Raw | ConvertFrom-Json
          $entry = [ordered]@{
            Author                 = $m.Author
            Name                   = $m.Name
            InternalName           = $m.InternalName
            AssemblyVersion        = $m.AssemblyVersion
            TestingAssemblyVersion = $m.AssemblyVersion
            Punchline              = $m.Punchline
            Description            = $m.Description
            ApplicableVersion      = "any"
            RepoUrl                = "https://github.com/$repo"
            Tags                   = @($m.Tags)
            DalamudApiLevel        = $m.DalamudApiLevel
            TestingDalamudApiLevel = $m.DalamudApiLevel
            IsHide                 = $false
            IsTestingExclusive     = $false
            LastUpdate             = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
            DownloadLinkInstall    = $url
            DownloadLinkUpdate     = $url
            DownloadLinkTesting    = $url
          }
          ConvertTo-Json -InputObject @($entry) -Depth 5 | Set-Content repo.json -Encoding utf8
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repo.json
          git commit -m "repo.json: $($m.Name) $($m.AssemblyVersion) [skip ci]"
          git push origin HEAD:main
